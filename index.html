<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner & Generator</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    :root {
      --mallard-green: #2B533E;
      --duck-yellow: #F2B824;
      --sterling-silver: #C0C0C0;
      --dark-green: #1e3a2b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--mallard-green);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--dark-green);
      border: 1px solid var(--sterling-silver);
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 {
      color: var(--duck-yellow);
      margin: 0 0 5px 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--sterling-silver);
      font-size: 13px;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--sterling-silver);
      background-color: #000;
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      padding: 14px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--sterling-silver);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .input-box:focus {
      border-color: var(--duck-yellow);
      box-shadow: 0 0 8px rgba(242, 184, 36, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-main {
      background-color: var(--duck-yellow);
      color: var(--dark-green);
    }

    .btn-main:hover {
      background-color: #db0;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--sterling-silver);
      color: var(--sterling-silver);
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: #fff;
    }

    .barcode-result {
      margin-top: 25px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 12px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    #barcode {
      max-width: 100%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h2>BARCODE SYSTEM</h2>
    <div class="subtitle">Prefix: 110765</div>
    
    <button class="btn btn-main" id="camBtn" onclick="toggleCamera()">เปิดกล้องสแกน</button>
    
    <div id="reader" style="display: none;"></div>
    
    <input type="text" id="scanInput" class="input-box" placeholder="หรือพิมพ์รหัสที่นี่..." autocomplete="off">

    <div class="barcode-result" id="resultBox">
      <svg id="barcode"></svg>
      <button class="btn btn-secondary" style="margin-top:15px; margin-bottom:0;" onclick="resetForm()">ล้างหน้าจอ</button>
    </div>
  </div>

  <script>
    const scanInput = document.getElementById('scanInput');
    const resultBox = document.getElementById('resultBox');
    const camBtn = document.getElementById('camBtn');
    let html5QrcodeScanner = null;

    // ระบบสแกนด้วยกล้อง
    function toggleCamera() {
      const readerDiv = document.getElementById('reader');
      
      if (readerDiv.style.display === "none") {
        readerDiv.style.display = "block";
        camBtn.innerText = "ปิดกล้อง";
        camBtn.style.backgroundColor = "#d9534f";
        camBtn.style.color = "#fff";
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" }, 
          { fps: 15, qrbox: { width: 260, height: 160 } },
          (decodedText) => {
            scanInput.value = decodedText;
            generateBarcode(decodedText);
            stopCamera();
          },
          (err) => { /* ปล่อยผ่านช่วงจับโฟกัส */ }
        ).catch(err => {
          alert("ไม่สามารถเข้าถึงกล้องได้: " + err);
          stopCamera();
        });
      } else {
        stopCamera();
      }
    }

    function stopCamera() {
      const readerDiv = document.getElementById('reader');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          readerDiv.style.display = "none";
          camBtn.innerText = "เปิดกล้องสแกน";
          camBtn.style.backgroundColor = "var(--duck-yellow)";
          camBtn.style.color = "var(--dark-green)";
        }).catch(err => console.log(err));
      }
    }

    // ระบบเจนบาร์โค้ด
    function generateBarcode(rawValue) {
      if (!rawValue) return;
      
      // รวมเลข 110765 ด้านหน้าเสมอ
      const finalCode = "110765" + rawValue;

      JsBarcode("#barcode", finalCode, {
        format: "CODE128",
        lineColor: "#000000",
        width: 2,
        height: 75,
        displayValue: true
      });

      resultBox.style.display = "block";
    }

    // ดักจับปุ่ม Enter (กรณีพนักงานพิมพ์เอง หรือใช้เครื่องยิง)
    scanInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateBarcode(scanInput.value.trim());
      }
    });

    function resetForm() {
      scanInput.value = "";
      resultBox.style.display = "none";
      scanInput.focus();
    }
  </script>
</body>
</html>
