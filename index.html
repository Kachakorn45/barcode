<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN MADE - Barcode System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    :root {
      --mallard-green: #2B533E;
      --duck-yellow: #F2B824;
      --sterling-silver: #C0C0C0;
      --vintage-cream: #F9F6F0;
      --dark-charcoal: #1A1A1A;
      --danger-red: #D9534F;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--mallard-green);
      color: var(--vintage-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--dark-charcoal);
      border: 3px solid var(--sterling-silver);
      padding: 35px 25px;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    .brand-logo {
      width: 80px;
      margin-bottom: 15px;
    }

    h1.welcome-title {
      font-weight: 900;
      font-size: 32px;
      color: var(--duck-yellow);
      margin: 0 0 5px 0;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--sterling-silver);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .credit-text {
      color: var(--duck-yellow);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .input-box {
      width: 100%;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--sterling-silver);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      margin-bottom: 20px;
    }

    .input-box:focus {
      border-color: var(--duck-yellow);
      background-color: rgba(255, 255, 255, 0.07);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-main {
      background-color: var(--duck-yellow);
      color: var(--dark-charcoal);
    }

    .btn-main:hover {
      background-color: #e5ad1c;
    }

    /* --- สไตล์ของหน้าต่างป๊อปอัปสแกนกล้อง (Modal) --- */
    .scanner-modal {
      display: none; /* ซ่อนไว้เริ่มต้น */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }

    .scanner-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .camera-wrapper {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid var(--sterling-silver);
      background-color: #000;
      margin-bottom: 20px;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
    }

    .btn-clear {
      background-color: var(--danger-red);
      color: white;
      max-width: 200px;
      margin: 0 auto;
    }

    .btn-clear:hover {
      background-color: #bd3a37;
    }

    /* โซนแสดงผลบาร์โค้ดที่เจนขึ้นมาใหม่ */
    .barcode-result {
      margin-top: 20px;
      padding: 25px 15px;
      background-color: var(--vintage-cream);
      border-radius: 16px;
      border: 2px solid var(--duck-yellow);
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    #barcode {
      max-width: 100%;
      height: auto;
    }

    .slogan-text {
      color: var(--duck-yellow);
      font-size: 12px;
      font-weight: 700;
      margin-top: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <img src="https://i.ibb.co/3s8b0XG/human-made-logo.png" alt="Human Made Duck Logo" class="brand-logo">
    <h1 class="welcome-title">ยินดีต้อนรับ</h1>
    <div class="subtitle">AUTOMATIC BARCODE • PREFIX 110765</div>
    <div class="credit-text">CREATE BY KACHAKORN</div>
    
    <input type="text" id="scanInput" class="input-box" placeholder="ALIGN CODE OR TYPE HERE..." autocomplete="off">
    
    <button class="btn btn-main" onclick="openScanner()">เปิดกล้องสแกนเนอร์</button>

    <div class="barcode-result" id="resultBox">
      <svg id="barcode"></svg>
    </div>

    <div class="slogan-text">STRIVING FOR THE FUTURE • DRY ALLS</div>
  </div>

  <div class="scanner-modal" id="scannerModal">
    <div class="scanner-content">
      <div class="camera-wrapper">
        <div id="reader"></div>
      </div>
      <button class="btn btn-clear" onclick="closeScanner()">ล้างข้อมูล</button>
    </div>
  </div>

  <script>
    const scanInput = document.getElementById('scanInput');
    const resultBox = document.getElementById('resultBox');
    const scannerModal = document.getElementById('scannerModal');
    let html5QrcodeScanner = null;

    // ฟังก์ชันเปิดหน้าต่างป๊อปอัปสแกนกล้อง
    function openScanner() {
      resultBox.style.display = "none"; // ซ่อนบาร์โค้ดอันเก่าก่อนสแกนใหม่
      scannerModal.style.display = "flex";
      
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      // การตั้งค่าขั้นสูงเพื่อให้กล้องจับโฟกัสอัตโนมัติตลอดเวลา สแกนง่าย ไม่เบลอ
      const config = { 
        fps: 25, 
        qrbox: { width: 280, height: 280 },
        videoConstraints: {
          facingMode: "environment",
          advanced: [{ focusMode: "continuous" }] // บังคับโฟกัสต่อเนื่อง
        }
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
          // สแกนสำเร็จ: บันทึกค่า ปิดหน้าต่าง และเจนบาร์โค้ด
          scanInput.value = decodedText;
          generateBarcode(decodedText);
          closeScanner();
        },
        (err) => { /* กำลังตรวจจับวัตถุในกล้อง */ }
      ).catch(err => {
        alert("ไม่สามารถเปิดระบบกล้องได้: " + err + "\n\nอย่าลืมอนุญาตสิทธิ์การเข้าถึงกล้องให้เบราว์เซอร์ด้วยนะครับ");
        closeScanner();
      });
    }

    // ฟังก์ชันปิดหน้าต่างป๊อปอัป (ล้างข้อมูล/ยกเลิก)
    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          scannerModal.style.display = "none";
          html5QrcodeScanner = null;
        }).catch(err => {
          console.log(err);
          scannerModal.style.display = "none";
        });
      } else {
        scannerModal.style.display = "none";
      }
      scanInput.value = "";
    }

    // ฟังก์ชันสร้างบาร์โค้ด 110765
    function generateBarcode(rawValue) {
      if (!rawValue) return;
      const finalCode = "110765" + rawValue;

      JsBarcode("#barcode", finalCode, {
        format: "CODE128",
        lineColor: "#1A1A1A",
        background: "#F9F6F0",
        width: 2,
        height: 75,
        displayValue: true,
        font: "Inter"
      });

      resultBox.style.display = "block";
    }

    // รองรับการทำงานเมื่อใช้เครื่องยิงหรือกด Enter ในช่องรับข้อมูล
    scanInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateBarcode(scanInput.value.trim());
      }
    });
  </script>
</body>
</html>
