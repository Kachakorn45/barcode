<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN MADE - Barcode System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    :root {
      --mallard-green: #2B533E;
      --duck-yellow: #F2B824;
      --sterling-silver: #C0C0C0;
      --vintage-cream: #F9F6F0;
      --dark-charcoal: #1A1A1A;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--mallard-green);
      color: var(--vintage-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--dark-charcoal);
      border: 3px solid var(--sterling-silver);
      padding: 35px 25px;
      border-radius: 24px; /* ทรงโค้ดมนสไตล์ Human Made */
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    h1.brand-title {
      font-weight: 800;
      font-size: 26px;
      color: var(--duck-yellow);
      margin: 0 0 5px 0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--sterling-silver);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* โซนกล้องสแกนที่ขยายกรอบให้ใหญ่ขึ้น */
    #reader {
      width: 100% !important;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--sterling-silver);
      background-color: #000;
      margin-bottom: 25px;
    }

    /* ตกแต่งวิดีโอกล้องด้านใน */
    #reader video {
      object-fit: cover !important;
    }

    .input-box {
      width: 100%;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--sterling-silver);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .input-box:focus {
      border-color: var(--duck-yellow);
      background-color: rgba(255, 255, 255, 0.07);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-main {
      background-color: var(--duck-yellow);
      color: var(--dark-charcoal);
    }

    .btn-main:hover {
      background-color: #e5ad1c;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid var(--sterling-silver);
      color: var(--sterling-silver);
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: #fff;
    }

    .barcode-result {
      margin-top: 30px;
      padding: 25px 15px;
      background-color: var(--vintage-cream); /* พื้นสีครีมวินเทจรองหลังแท่งบาร์โค้ด */
      border-radius: 16px;
      border: 2px solid var(--duck-yellow);
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    #barcode {
      max-width: 100%;
      height: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="brand-title">GEARS FOR FUTURISTIC TEENAGERS</h1>
    <div class="subtitle">AUTOMATIC BARCODE • PREFIX 110765</div>
    
    <button class="btn btn-main" id="camBtn" onclick="toggleCamera()">เปิดกล้องสแกนเนอร์</button>
    
    <div id="reader" style="display: none;"></div>
    
    <input type="text" id="scanInput" class="input-box" placeholder="ALIGN CODE OR TYPE HERE..." autocomplete="off">

    <div class="barcode-result" id="resultBox">
      <svg id="barcode"></svg>
      <button class="btn btn-secondary" style="margin-top:20px; margin-bottom:0;" onclick="resetForm()">ล้างข้อมูล</button>
    </div>
  </div>

  <script>
    const scanInput = document.getElementById('scanInput');
    const resultBox = document.getElementById('resultBox');
    const camBtn = document.getElementById('camBtn');
    let html5QrcodeScanner = null;

    function toggleCamera() {
      const readerDiv = document.getElementById('reader');
      
      if (readerDiv.style.display === "none") {
        readerDiv.style.display = "block";
        camBtn.innerText = "ปิดหน้ากล้อง";
        camBtn.style.backgroundColor = "#d9534f";
        camBtn.style.color = "#fff";
        
        // ค้นหาอุปกรณ์กล้องทั้งหมดเพื่อเจาะจงกล้องหลังที่ถูกต้อง
        Html5Qrcode.getCameras().then(cameras => {
          if (cameras && cameras.length > 0) {
            // เลือกกล้องตัวสุดท้าย (มักจะเป็นกล้องหลังตัวหลักของมือถือรุ่นใหม่ๆ)
            const backCameraId = cameras[cameras.length - 1].id;
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
              backCameraId, 
              { 
                fps: 20, 
                // ปรับเพิ่มขนาดช่องเล็งเป็น 300x300 ใหญ่เต็มตา สแกน QR ได้ง่ายขึ้นมากครับ
                qrbox: { width: 300, height: 300 } 
              },
              (decodedText) => {
                scanInput.value = decodedText;
                generateBarcode(decodedText);
                stopCamera();
              },
              (err) => { /* ล่าเป้าหมาย */ }
            ).catch(err => {
              alert("ไม่สามารถเริ่มระบบกล้องได้: " + err);
              stopCamera();
            });
          } else {
            alert("ไม่พบกล้องถ่ายรูปบนอุปกรณ์นี้");
            stopCamera();
          }
        }).catch(err => {
          alert("ไม่สามารถเข้าถึงรายชื่อกล้องได้: " + err);
          stopCamera();
        });
      } else {
        stopCamera();
      }
    }

    function stopCamera() {
      const readerDiv = document.getElementById('reader');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          readerDiv.style.display = "none";
          camBtn.innerText = "เปิดกล้องสแกนเนอร์";
          camBtn.style.backgroundColor = "var(--duck-yellow)";
          camBtn.style.color = "var(--dark-charcoal)";
        }).catch(err => console.log(err));
      }
    }

    function generateBarcode(rawValue) {
      if (!rawValue) return;
      const finalCode = "110765" + rawValue;

      JsBarcode("#barcode", finalCode, {
        format: "CODE128",
        lineColor: "#1A1A1A",
        background: "#F9F6F0",
        width: 2,
        height: 75,
        displayValue: true,
        font: "Inter"
      });

      resultBox.style.display = "block";
    }

    scanInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateBarcode(scanInput.value.trim());
      }
    });

    function resetForm() {
      scanInput.value = "";
      resultBox.style.display = "none";
      scanInput.focus();
    }
  </script>
</body>
</html>
