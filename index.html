<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN MADE - Barcode System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    :root {
      --mallard-green: #2B533E;
      --duck-yellow: #F2B824;
      --sterling-silver: #C0C0C0;
      --vintage-cream: #F9F6F0;
      --dark-charcoal: #1A1A1A;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--mallard-green);
      color: var(--vintage-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--dark-charcoal);
      border: 3px solid var(--sterling-silver);
      padding: 35px 25px;
      border-radius: 24px; /* ทรงโค้ดมนสไตล์ Human Made */
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    /* โลโก้เป็ด Human Made */
    .brand-logo {
      width: 100px;
      margin-bottom: 20px;
    }

    h1.welcome-title {
      font-weight: 800;
      font-size: 28px;
      color: var(--duck-yellow);
      margin: 0 0 10px 0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--sterling-silver);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .credit-text {
      color: var(--vintage-cream);
      font-size: 10px;
      font-weight: 400;
      margin-bottom: 30px;
    }

    /* โซนกล้องสแกนที่ขยายกรอบให้ใหญ่ขึ้น */
    #reader {
      width: 100% !important;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--sterling-silver);
      background-color: #000;
      margin-bottom: 25px;
    }

    /* ตกแต่งวิดีโอกล้องด้านใน */
    #reader video {
      object-fit: cover !important;
    }

    .input-box {
      width: 100%;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--sterling-silver);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .input-box:focus {
      border-color: var(--duck-yellow);
      background-color: rgba(255, 255, 255, 0.07);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-main {
      background-color: var(--duck-yellow);
      color: var(--dark-charcoal);
    }

    .btn-main:hover {
      background-color: #e5ad1c;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid var(--sterling-silver);
      color: var(--sterling-silver);
    }

    .btn-secondary:hover {
      color: #fff;
      border-color: #fff;
    }

    /* ปุ่มล้างข้อมูลสีแดงสไตล์ Human Made */
    .btn-clear {
      background-color: #d9534f;
      color: white;
    }

    .barcode-result {
      margin-top: 30px;
      padding: 25px 15px;
      background-color: var(--vintage-cream); /* พื้นสีครีมวินเทจรองหลังแท่งบาร์โค้ด */
      border-radius: 16px;
      border: 2px solid var(--duck-yellow);
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    #barcode {
      max-width: 100%;
      height: auto;
    }

    .slogan-text {
      color: var(--duck-yellow);
      font-size: 12px;
      font-weight: 600;
      margin-top: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <img src="https://i.ibb.co/3s8b0XG/human-made-logo.png" alt="Human Made Duck Logo" class="brand-logo">
    <h1 class="welcome-title">ยินดีต้อนรับ</h1>
    <div class="subtitle">AUTOMATIC BARCODE • PREFIX 110765</div>
    <div class="credit-text">CREATE BY KACHAKORN</div>
    
    <button class="btn btn-main" id="camBtn" onclick="toggleCamera()">เปิดกล้องสแกนเนอร์</button>
    
    <div id="reader" style="display: none;"></div>
    
    <input type="text" id="scanInput" class="input-box" placeholder="ALIGN CODE OR TYPE HERE..." autocomplete="off">

    <button class="btn btn-clear" id="clearBtn" style="display: none;" onclick="resetForm()">ล้างข้อมูล</button>

    <div class="barcode-result" id="resultBox">
      <svg id="barcode"></svg>
    </div>

    <div class="slogan-text">STRIVING FOR THE FUTURE • DRY ALLS</div>
  </div>

  <script>
    const scanInput = document.getElementById('scanInput');
    const resultBox = document.getElementById('resultBox');
    const camBtn = document.getElementById('camBtn');
    const clearBtn = document.getElementById('clearBtn');
    let html5QrcodeScanner = null;

    function toggleCamera() {
      const readerDiv = document.getElementById('reader');
      
      if (readerDiv.style.display === "none") {
        readerDiv.style.display = "block";
        camBtn.innerText = "ปิดหน้ากล้อง";
        camBtn.style.backgroundColor = "#d9534f";
        camBtn.style.color = "#fff";
        clearBtn.style.display = "none";
        
        // แก้ไขปัญหากล้องไม่โฟกัส: สั่งให้ระบบทำการค้นหาและล็อกเลือกไปที่กล้องหลังตัวหลักที่มีความละเอียดสูงสุดโดยอัตโนมัติ
        Html5Qrcode.getCameras().then(cameras => {
          if (cameras && cameras.length > 0) {
            // เลือกกล้องหลังตัวหลักโดยใช้ facingMode: "environment"
            const config = { fps: 20, qrbox: { width: 300, height: 300 } };
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
              { facingMode: "environment" }, 
              config,
              (decodedText) => {
                scanInput.value = decodedText;
                generateBarcode(decodedText);
                stopCamera();
              },
              (err) => { /* ล่าเป้าหมาย */ }
            ).catch(err => {
              alert("ไม่สามารถเริ่มระบบกล้องได้: " + err);
              stopCamera();
            });
          } else {
            alert("ไม่พบกล้องถ่ายรูปบนอุปกรณ์นี้");
            stopCamera();
          }
        }).catch(err => {
          alert("ไม่สามารถเข้าถึงรายชื่อกล้องได้: " + err);
          stopCamera();
        });
      } else {
        stopCamera();
      }
    }

    function stopCamera() {
      const readerDiv = document.getElementById('reader');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          readerDiv.style.display = "none";
          camBtn.innerText = "เปิดกล้องสแกนเนอร์";
          camBtn.style.backgroundColor = "var(--duck-yellow)";
          camBtn.style.color = "var(--dark-charcoal)";
          clearBtn.style.display = "block";
        }).catch(err => console.log(err));
      }
    }

    function generateBarcode(rawValue) {
      if (!rawValue) return;
      const finalCode = "110765" + rawValue;

      JsBarcode("#barcode", finalCode, {
        format: "CODE128",
        lineColor: "#1A1A1A",
        background: "#F9F6F0",
        width: 2,
        height: 75,
        displayValue: true,
        font: "Inter"
      });

      resultBox.style.display = "block";
      clearBtn.style.display = "block";
    }

    scanInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateBarcode(scanInput.value.trim());
      }
    });

    function resetForm() {
      scanInput.value = "";
      resultBox.style.display = "none";
      clearBtn.style.display = "none";
      camBtn.innerText = "เปิดกล้องสแกนเนอร์";
      camBtn.style.backgroundColor = "var(--duck-yellow)";
      camBtn.style.color = "var(--dark-charcoal)";
      document.getElementById('reader').style.display = "none";
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().catch(err => console.log(err));
      }
      scanInput.focus();
    }
  </script>
</body>
</html>
