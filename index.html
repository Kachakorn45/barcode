<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN MADE - Barcode System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    :root {
      --mallard-green: #2B533E;
      --duck-yellow: #F2B824;
      --sterling-silver: #C0C0C0;
      --vintage-cream: #F9F6F0;
      --dark-charcoal: #1A1A1A;
      --danger-red: #D9534F;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--mallard-green);
      color: var(--vintage-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .app-card {
      background-color: var(--dark-charcoal);
      border: 3px solid var(--sterling-silver);
      padding: 40px 25px;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    h1.welcome-title {
      font-weight: 900;
      font-size: 34px;
      color: var(--duck-yellow);
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--sterling-silver);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .credit-text {
      color: var(--duck-yellow);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    .input-box {
      width: 100%;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--sterling-silver);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      margin-bottom: 20px;
    }

    .input-box:focus {
      border-color: var(--duck-yellow);
      background-color: rgba(255, 255, 255, 0.07);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-main {
      background-color: var(--duck-yellow);
      color: var(--dark-charcoal);
    }

    .btn-main:hover {
      background-color: #e5ad1c;
    }

    /* --- หน้าต่างป๊อปอัปทั่วไป (โครงสร้างพื้นฐาน) --- */
    .custom-modal {
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }

    /* --- หน้าต่างป๊อปอัปสแกนกล้อง --- */
    .scanner-content {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .camera-wrapper {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid var(--sterling-silver);
      background-color: #000;
      margin-bottom: 20px;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
    }

    .btn-clear {
      background-color: var(--danger-red);
      color: white;
      max-width: 200px;
      margin: 0 auto;
    }

    .btn-clear:hover {
      background-color: #bd3a37;
    }

    /* --- หน้าต่างป๊อปอัปผลลัพธ์บาร์โค้ดขนาดใหญ่พิเศษ --- */
    .barcode-popup-content {
      width: 100%;
      max-width: 460px;
      background-color: var(--vintage-cream);
      padding: 35px 20px;
      border-radius: 24px;
      border: 4px solid var(--duck-yellow);
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: popupScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .barcode-popup-title {
      color: var(--dark-charcoal);
      font-weight: 900;
      font-size: 20px;
      margin: 0 0 25px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .barcode-wrapper {
      width: 100%;
      background-color: #ffffff;
      padding: 25px 10px;
      border-radius: 14px;
      border: 2px solid var(--sterling-silver);
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* สั่งขยายขนาดบาร์โค้ดให้ใหญ่เต็มพิกัดและยิงง่าย */
    #popupBarcode {
      width: 100% !important;
      height: auto !important;
      min-height: 110px;
    }

    .btn-close-barcode {
      background-color: var(--dark-charcoal);
      color: var(--vintage-cream);
      border: 2px solid var(--dark-charcoal);
      margin-top: 25px;
      margin-bottom: 0;
    }

    .btn-close-barcode:hover {
      background-color: transparent;
      color: var(--dark-charcoal);
    }

    .slogan-text {
      color: var(--duck-yellow);
      font-size: 12px;
      font-weight: 700;
      margin-top: 35px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes popupScale {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h1 class="welcome-title">ยินดีต้อนรับ</h1>
    <div class="subtitle">AUTOMATIC BARCODE • PREFIX 110765</div>
    <div class="credit-text">CREATE BY KACHAKORN</div>
    
    <input type="text" id="scanInput" class="input-box" placeholder="ALIGN CODE OR TYPE HERE..." autocomplete="off">
    
    <button class="btn btn-main" onclick="openScanner()">เปิดกล้องสแกนเนอร์</button>

    <div class="slogan-text">ขอให้เป็นวันดี...ดี</div>
  </div>

  <div class="custom-modal" id="scannerModal">
    <div class="scanner-content">
      <div class="camera-wrapper">
        <div id="reader"></div>
      </div>
      <button class="btn btn-clear" onclick="closeScanner()">ล้างข้อมูล</button>
    </div>
  </div>

  <div class="custom-modal" id="barcodeResultModal">
    <div class="barcode-popup-content">
      <div class="barcode-popup-title">สแกนสำเร็จ / BARCODE READY</div>
      
      <div class="barcode-wrapper">
        <svg id="popupBarcode"></svg>
      </div>
      
      <button class="btn btn-close-barcode" onclick="closeBarcodeModal()">ปิดหน้าต่างนี้</button>
    </div>
  </div>

  <script>
    const scanInput = document.getElementById('scanInput');
    const scannerModal = document.getElementById('scannerModal');
    const barcodeResultModal = document.getElementById('barcodeResultModal');
    let html5QrcodeScanner = null;

    // เปิดกล้องสแกนเนอร์
    function openScanner() {
      scannerModal.style.display = "flex";
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 25, 
        qrbox: { width: 280, height: 280 },
        videoConstraints: {
          facingMode: "environment",
          advanced: [{ focusMode: "continuous" }] // บังคับโฟกัสต่อเนื่องตลอดเวลา
        }
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
          // สแกนสำเร็จ: บันทึกค่า, ปิดกล้อง, และเปิดป๊อปอัปบาร์โค้ดทันที
          scanInput.value = decodedText;
          generatePopupBarcode(decodedText);
          closeScannerAfterSuccess();
        },
        (err) => { /* ระบบกำลังทำงาน */ }
      ).catch(err => {
        alert("ไม่สามารถเปิดกล้องได้: " + err + "\n\nกรุณาตรวจสอบสิทธิ์กล้องบนเบราว์เซอร์ของคุณ");
        closeScanner();
      });
    }

    // ปิดกล้องกรณีผู้ใช้กด "ล้างข้อมูล"
    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          scannerModal.style.display = "none";
          html5QrcodeScanner = null;
        }).catch(err => {
          console.log(err);
          scannerModal.style.display = "none";
        });
      } else {
        scannerModal.style.display = "none";
      }
      scanInput.value = "";
    }

    // ฟังก์ชันภายในใช้ปิดกล้องอย่างปลอดภัยหลังสแกนติด
    function closeScannerAfterSuccess() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          scannerModal.style.display = "none";
          html5QrcodeScanner = null;
        }).catch(err => {
          console.log(err);
          scannerModal.style.display = "none";
        });
      } else {
        scannerModal.style.display = "none";
      }
    }

    // ฟังก์ชันสร้างบาร์โค้ดขนาดใหญ่ลงบนป๊อปอัปผลลัพธ์
    function generatePopupBarcode(rawValue) {
      if (!rawValue) return;
      const finalCode = "110765" + rawValue;

      // เจนบาร์โค้ดขนาดใหญ่พิเศษลงในป๊อปอัป
      JsBarcode("#popupBarcode", finalCode, {
        format: "CODE128",
        lineColor: "#1A1A1A",
        background: "#FFFFFF",
        width: 3,        // เพิ่มความหนาเส้นเพื่อให้ปืนสแกนง่ายขึ้นมากๆ
        height: 100,     // เพิ่มความสูงของแท่งบาร์โค้ด
        displayValue: true,
        fontSize: 20,    // ขนาดตัวเลขด้านล่างใหญ่ชัดเจน
        font: "Inter"
      });

      // เปิดหน้าต่างป๊อปอัปบาร์โค้ดแสดงผลขึ้นมาบังหน้าจอ
      barcodeResultModal.style.display = "flex";
    }

    // ฟังก์ชันปิดหน้าต่างป๊อปอัปบาร์โค้ด
    function closeBarcodeModal() {
      barcodeResultModal.style.display = "none";
      scanInput.value = "";
      scanInput.focus();
    }

    // รองรับกรณีพนักงานคีย์เลขเองในช่องแล้วกด Enter
    scanInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generatePopupBarcode(scanInput.value.trim());
      }
    });
  </script>
</body>
</html>
